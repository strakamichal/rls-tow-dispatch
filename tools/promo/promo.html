<!doctype html>
<!--
  Promo graphics for beamng.com and the README: a photo-mode background, the in-game phone in its
  in-game corner, and a headline. Rendered by tools/promo/render.ps1 (headless Edge, 1920 × 1080).
  Choose a graphic with ?g=<name>; images are read from .cache/promo/ (see tools/promo/README.md).
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --amber: #ffb81c; --ink: #15171a; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  .stage { position: relative; width: 1920px; height: 1080px; font-family: Overpass, sans-serif; color: #fff; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  /* Darken only the top-left corner for the text. */
  .shade { position: absolute; inset: 0;
    background: radial-gradient(120% 90% at 0% 0%, rgba(10,11,13,.6) 0%, rgba(10,11,13,.35) 30%, rgba(10,11,13,0) 55%); }
  .hazard { position: absolute; left: 0; right: 0; top: 0; height: 12px;
    background: repeating-linear-gradient(-45deg, var(--amber) 0 20px, var(--ink) 20px 40px); }
  /* Where and how big the RLS phone sits in game at 2560 × 1440, scaled to 1920 × 1080. */
  .phone { position: absolute; right: 25px; bottom: 25px; height: 662px; clip-path: inset(4px round 34px); }
  .copy { position: absolute; left: 90px; top: 80px; width: 860px; }
  .kicker { font-weight: 800; font-size: 22px; letter-spacing: .22em; color: var(--amber); text-transform: uppercase; }
  h1 { margin: 8px 0 0; font-weight: 900; font-size: 86px; line-height: .95; letter-spacing: -.01em;
    text-shadow: 0 4px 24px rgba(0,0,0,.55); }
  h1 em { font-style: normal; color: var(--amber); }
  .sub { margin-top: 18px; font-weight: 600; font-size: 28px; line-height: 1.32;
    color: rgba(255,255,255,.93); text-shadow: 0 2px 14px rgba(0,0,0,.75); }
  .brand { position: absolute; left: 90px; bottom: 60px; text-shadow: 0 2px 14px rgba(0,0,0,.85); }
  .brand b { display: block; font-weight: 900; font-size: 36px; letter-spacing: .04em; }
  .brand span { font-weight: 600; font-size: 20px; letter-spacing: .18em; color: var(--amber); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="stage">
    <img class="bg" id="bg" alt="">
    <div class="shade"></div>
    <div class="hazard"></div>
    <img class="phone" id="phone" alt="">
    <div class="copy">
      <div class="kicker" id="kicker"></div>
      <h1 id="title"></h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="brand"><b>TOW DISPATCH</b><span>for RLS Career Overhaul</span></div>
  </div>
<script>
  const ASSETS = "../../.cache/promo/"
  const GRAPHICS = {
    board: {
      bg: "bg-board.png", phone: "phone-board.png",
      kicker: "Roadside & recovery",
      title: "Take<br><em>the call.</em>",
      sub: "Broken-down cars all over the map, from cheap runabouts to exotics and heavy trucks. Every call shows the pay, the fault and the route before you accept.",
    },
    delivery: {
      bg: "bg-delivery.png", phone: "phone-delivery.png",
      kicker: "Towing, not driving",
      title: "Tow it,<br><em>don't drive it.</em>",
      sub: "Load the car on your truck and deliver it home or to a service. Drive it there yourself and the pay drops.",
    },
    completion: {
      bg: "bg-completion.png", phone: "phone-completion.png",
      kicker: "Part of your career",
      title: "Your own rig<br><em>pays more.</em>",
      sub: "+20 % on every tow with your own truck. Payouts land in Wallet, XP goes to your Recovery skill.",
    },
  }
  const g = GRAPHICS[new URLSearchParams(location.search).get("g")] || GRAPHICS.delivery
  document.getElementById("bg").src = ASSETS + g.bg
  document.getElementById("phone").src = ASSETS + g.phone
  document.getElementById("kicker").textContent = g.kicker
  document.getElementById("title").innerHTML = g.title
  document.getElementById("sub").textContent = g.sub
</script>
</body>
</html>
